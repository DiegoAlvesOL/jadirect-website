# Purpose    : Nginx server configuration. Defines routing, security headers,
#              and static asset caching for the JADirect static site.
# Consumed by: Nginx process inside the Docker container
# Layer      : Infrastructure

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers, applied to every response from this server block
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.googletagmanager.com https://www.google-analytics.com; connect-src 'self' https://api.web3forms.com https://www.google-analytics.com; img-src 'self' data:; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com" always;

    # Default routing, tries the exact file, then falls back to a 404
    location / {
        try_files $uri $uri/ =404;
    }

    # Long-lived cache for static assets, CSS, JS and images rarely change per deploy
    location ~* \.(?:css|js|png|jpg|jpeg|gif|svg|webp)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
