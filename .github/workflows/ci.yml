name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Lint HTML
        run: npm run lint:html

      - name: Lint CSS
        run: npm run lint:css

      - name: Testes unitários
        run: npm test

      - name: Subir ambiente local (Docker Compose)
        run: docker compose up --build -d

      - name: Aguardar o container ficar pronto
        run: |
          for i in $(seq 1 10); do
            curl -sf http://localhost:8081 && break
            echo "Aguardando o Nginx responder... tentativa $i"
            sleep 2
          done

      - name: Teste de acessibilidade
        run: npm run test:a11y

      - name: Teste de links quebrados
        run: npm run test:links

      - name: Derrubar o ambiente local
        if: always()
        run: docker compose down

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Build da imagem Docker
        run: docker build -t jadirect-website .